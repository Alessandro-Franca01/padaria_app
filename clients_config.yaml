# Configuração de Clientes para Multi-Deploy
# Coloque este arquivo na raiz do projeto

clients:
  padaria_central:
    app_name: "Padaria Central"
    package_name: "com.padariaapp.central"
    app_id_suffix: ".central"
    colors:
      primary: "#8B4513"           # Brown
      primary_dark: "#5D2F0E"
      accent: "#FF9800"            # Orange
      secondary: "#FFA726"
    strings:
      app_name: "Padaria Central"
      splash_text: "Seu pão fresquinho na palma da mão"
      home_welcome: "Bem-vindo à Padaria Central!"
    icons:
      android: "assets/icons/clients/central/android"
      ios: "assets/icons/clients/central/ios"
    google_play:
      track: "production"
      json_key_file: "fastlane/keys/padaria_central_key.json"
      package_name: "com.padariaapp.central"

  padaria_nordeste:
    app_name: "Padaria Nordeste"
    package_name: "com.padariaapp.nordeste"
    app_id_suffix: ".nordeste"
    colors:
      primary: "#D32F2F"           # Red
      primary_dark: "#B71C1C"
      accent: "#FFC107"            # Amber
      secondary: "#FFD54F"
    strings:
      app_name: "Padaria Nordeste"
      splash_text: "Sabor tradicional do Nordeste"
      home_welcome: "Bem-vindo à Padaria Nordeste!"
    icons:
      android: "assets/icons/clients/nordeste/android"
      ios: "assets/icons/clients/nordeste/ios"
    google_play:
      track: "production"
      json_key_file: "fastlane/keys/padaria_nordeste_key.json"
      package_name: "com.padariaapp.nordeste"

# Configurações Globais
global:
  flutter_version: "3.24.0"
  min_sdk_version: 21
  target_sdk_version: 34
  version_name: "1.0.0"
  version_code: 1
  build_type: "release"